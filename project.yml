name: IslandAgent
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "13.0.0"

targets:
  IslandMac:
    type: application
    platform: macOS
    sources:
      - Mac
      - Shared
      - path: Firebase/GoogleService-Info-Mac.plist
        optional: true
        buildPhase: resources
    dependencies:
      - package: Firebase
        products:
          - FirebaseCore
          - FirebaseAuth
          - FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myname.IslandMac
        PRODUCT_NAME: Island Agent
        SWIFT_VERSION: "5.0"
        ENABLE_APP_SANDBOX: YES
    entitlements:
      path: Mac/IslandMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"
    info:
      path: Mac/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Island Agent uses the microphone while you hold the hotkey to capture your prompt."
        NSSpeechRecognitionUsageDescription: "Island Agent transcribes your prompt on this Mac while you hold the hotkey."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  IslandIOS:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
      - path: Firebase/GoogleService-Info-iOS.plist
        optional: true
        buildPhase: resources
    dependencies:
      - package: Firebase
        products:
          - FirebaseCore
          - FirebaseAuth
          - FirebaseFirestore
          - FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myname.IslandIOS
        PRODUCT_NAME: Island Buddy
        SWIFT_VERSION: "5.0"
    info:
      path: iOS/Info.plist
      properties:
        FirebaseAppDelegateProxyEnabled: false
        FirebaseMessagingInstallationIdEnabled: true
