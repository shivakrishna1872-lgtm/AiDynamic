<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#151d31"/><stop offset="1" stop-color="#080d19"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#547af8" stop-opacity=".26"/><stop offset="1" stop-color="#547af8" stop-opacity="0"/></radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#101116"/><stop offset="1" stop-color="#030407"/></linearGradient>
    <linearGradient id="skin" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#ffe1c8"/><stop offset=".58" stop-color="#f6b39a"/><stop offset="1" stop-color="#d98380"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#91aaff"/><stop offset="1" stop-color="#4b65c8"/></linearGradient>
    <filter id="shadow" x="-50%" y="-40%" width="200%" height="200%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".42"/></filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <symbol id="character" viewBox="0 0 150 190"><ellipse cx="58" cy="174" rx="11" ry="8" fill="#5870cf"/><ellipse cx="91" cy="174" rx="11" ry="8" fill="#5870cf"/><ellipse cx="75" cy="145" rx="34" ry="30" fill="url(#body)" stroke="#bac8ff" stroke-opacity=".65" stroke-width="2"/><ellipse cx="62" cy="128" rx="17" ry="5" fill="#fff" opacity=".22"/><g class="leftArm"><rect x="27" y="126" width="16" height="39" rx="8" fill="url(#skin)"/><circle cx="35" cy="163" r="9" fill="#f1a78f"/></g><g class="rightArm"><rect x="108" y="124" width="16" height="39" rx="8" fill="url(#skin)"/><circle cx="116" cy="162" r="9" fill="#f1a78f"/></g><circle cx="75" cy="76" r="63" fill="url(#skin)" stroke="#fff1e7" stroke-opacity=".8" stroke-width="2"/><ellipse cx="52" cy="35" rx="26" ry="14" fill="#fff" opacity=".35"/><ellipse cx="104" cy="103" rx="26" ry="17" fill="#be6576" opacity=".12"/><ellipse cx="39" cy="95" rx="10" ry="6" fill="#f48789" opacity=".34"/><ellipse cx="111" cy="95" rx="10" ry="6" fill="#f48789" opacity=".34"/><g class="eyes"><ellipse cx="55" cy="71" rx="12" ry="17" fill="#fff"/><ellipse cx="95" cy="71" rx="12" ry="17" fill="#fff"/><ellipse cx="57" cy="74" rx="7" ry="10" fill="#28324d"/><ellipse cx="97" cy="74" rx="7" ry="10" fill="#28324d"/><circle cx="54" cy="69" r="3" fill="#fff"/><circle cx="94" cy="69" r="3" fill="#fff"/></g><g class="brows"><path d="M43 50 Q55 44 65 50" fill="none" stroke="#7e4d59" stroke-width="4" stroke-linecap="round"/><path d="M84 50 Q96 44 108 50" fill="none" stroke="#7e4d59" stroke-width="4" stroke-linecap="round"/></g><path class="mouth" d="M61 101 Q75 115 90 100" fill="none" stroke="#7c3547" stroke-width="5" stroke-linecap="round"/><path class="mouthFill" d="M64 103 Q75 111 87 102 Q84 115 75 115 Q67 113 64 103" fill="#873d55" opacity="0"/><path d="M67 105 Q75 109 84 104" fill="none" stroke="#ffaaa7" stroke-width="2" stroke-linecap="round"/></symbol>
    <style>
      .scene{opacity:0;animation:scene 15.5s infinite}#s1{animation-delay:0s}#s2{animation-delay:2.3s}#s3{animation-delay:3.7s}#s4{animation-delay:5.1s}#s5{animation-delay:9.2s}#s6{animation-delay:10.1s}
      @keyframes scene{0%,14.8%{opacity:1}15.2%,100%{opacity:0}}.mascot{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.2s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      #s2 .mascot{animation:waveBob .6s ease-in-out infinite alternate}@keyframes waveBob{to{transform:translateY(-9px) rotate(-2deg)}}#s2 .rightArm{transform-box:fill-box;transform-origin:50% 5%;animation:wave .24s ease-in-out infinite alternate}@keyframes wave{to{transform:rotate(-58deg) translateY(-3px)}}
      #s3 .mascot{transform:rotate(-10deg) translateY(3px)}#s3 .eyes{transform:translate(2px,-3px)}#s4 .mascot{animation:think 2.2s ease-in-out infinite}@keyframes think{0%,100%{transform:translateY(2px) rotate(2deg)}50%{transform:translateY(-2px) rotate(-1deg)}}#s4 .eyes{transform:translate(1px,-5px)}
      #s4 .rightArm{transform-box:fill-box;transform-origin:50% 5%;transform:rotate(-55deg) translate(-4px,-3px)}#s4 .thought{animation:thought 1.2s ease-in-out infinite}@keyframes thought{0%,100%{opacity:.25;transform:translateY(4px)}50%{opacity:1;transform:translateY(-4px)}}
      #s5 .mascot{transform:translateY(-8px) scale(1.05)}#s5 .eyes{transform:scale(1.1);transform-origin:center}#s5 .mouth{opacity:0}#s5 .mouthFill{opacity:1}#s6 .mascot{animation:celebrate .28s ease-in-out infinite alternate}@keyframes celebrate{to{transform:translateY(-13px) rotate(3deg) scale(1.03)}}
      #s6 .leftArm{transform-box:fill-box;transform-origin:50% 5%;transform:rotate(39deg)}#s6 .rightArm{transform-box:fill-box;transform-origin:50% 5%;transform:rotate(-45deg)}#s6 .mouth{stroke-width:7}.spark{animation:twinkle 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes twinkle{to{opacity:.35;transform:scale(.65)}}
    </style>
  </defs>
  <rect width="900" height="640" rx="38" fill="url(#bg)"/><circle cx="450" cy="328" r="290" fill="url(#halo)"/>
  <text x="58" y="62" fill="#f5f7ff" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="24" font-weight="700">Your little AI companion</text><text x="59" y="91" fill="#aab5ce" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="13">A playful, expressive friend that lives beside its island</text>
  <rect x="313" y="120" width="274" height="460" rx="49" fill="#12151d" stroke="#737d92" stroke-width="3"/><rect x="324" y="132" width="252" height="436" rx="39" fill="#f1f4f8"/><rect x="408" y="132" width="84" height="22" rx="11" fill="#080a0e"/>
  <text x="344" y="183" fill="#202838" font-family="Arial" font-size="11" font-weight="700">9:41</text><text x="346" y="218" fill="#192234" font-family="Arial" font-size="17" font-weight="700">Good morning</text><text x="346" y="240" fill="#717d90" font-family="Arial" font-size="11">What shall we make today?</text><rect x="343" y="405" width="214" height="98" rx="20" fill="#fff" stroke="#e2e7ef"/><text x="361" y="433" fill="#243049" font-family="Arial" font-size="11" font-weight="700">Your local assistant</text><text x="361" y="453" fill="#778196" font-family="Arial" font-size="10">No cloud keys. Just a little help.</text><rect x="361" y="466" width="93" height="24" rx="12" fill="#edf1ff"/><text x="375" y="482" fill="#5068c9" font-family="Arial" font-size="9" font-weight="700">Start a chat</text><text x="345" y="535" fill="#b5bdca" font-family="Arial" font-size="9">Today</text>
  <g filter="url(#shadow)"><rect x="358" y="144" width="183" height="51" rx="26" fill="url(#pill)" stroke="#303743" stroke-width="1.5"/><rect x="373" y="152" width="153" height="1.4" rx="1" fill="#fff" opacity=".13"/></g><circle cx="388" cy="169" r="4" fill="#69e5a4" filter="url(#softGlow)"/><text x="401" y="173" fill="#d4dae6" font-family="Arial" font-size="8" font-weight="700" letter-spacing="1.1">ISLAND BUDDY</text>
  <g id="s1" class="scene"><g class="mascot"><use href="#character" x="472" y="165" width="114" height="144"/></g><text x="429" y="336" fill="#e9eeff" font-family="Arial" font-size="11" font-weight="600">Just hanging out</text></g><g id="s2" class="scene"><g class="mascot"><use href="#character" x="472" y="165" width="114" height="144"/></g><text x="438" y="336" fill="#e9eeff" font-family="Arial" font-size="11" font-weight="600">Oh! You're here!</text><path class="spark" d="M555 214l4 8 8 3-8 4-4 8-4-8-8-4 8-3z" fill="#ffe27a"/></g>
  <g id="s3" class="scene"><g class="mascot"><use href="#character" x="472" y="165" width="114" height="144"/></g><text x="443" y="336" fill="#e9eeff" font-family="Arial" font-size="11" font-weight="600">What's that?</text></g><g id="s4" class="scene"><g class="mascot"><use href="#character" x="472" y="165" width="114" height="144"/></g><g class="thought"><circle cx="566" cy="216" r="8" fill="#c2d2ff"/><circle cx="558" cy="230" r="5" fill="#c2d2ff"/><circle cx="551" cy="239" r="3" fill="#c2d2ff"/></g><text x="444" y="336" fill="#e9eeff" font-family="Arial" font-size="11" font-weight="600">Let me think…</text></g>
  <g id="s5" class="scene"><g class="mascot"><use href="#character" x="472" y="165" width="114" height="144"/></g><path class="spark" d="M555 207l5 11 11 4-11 5-5 11-5-11-11-5 11-4z" fill="#ffe27a" filter="url(#softGlow)"/><text x="440" y="336" fill="#e9eeff" font-family="Arial" font-size="11" font-weight="600">I've got an idea!</text></g><g id="s6" class="scene"><g class="mascot"><use href="#character" x="472" y="165" width="114" height="144"/></g><path class="spark" d="M550 210l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#ffe27a"/><path class="spark" d="M576 240l3 6 6 2-6 3-3 6-3-6-6-3 6-2z" fill="#91e8ff"/><text x="451" y="336" fill="#e9eeff" font-family="Arial" font-size="11" font-weight="600">We did it!</text></g>
  <text x="58" y="611" fill="#8491aa" font-family="Arial" font-size="11">Animation loop: idle → wave → curious → thoughtful → idea → celebrate → idle</text>
</svg>
